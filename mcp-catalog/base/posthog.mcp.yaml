name: PostHog
shortDescription: Query PostHog product analytics, events, cohorts, and HogQL
description: |
  PostHog MCP server exposed through Trellis/Obot via a local stdio bridge.

  Use this server for product analytics, event exploration, funnels, cohorts, and
  HogQL queries. The flora-frontend data skill expects PostHog access to Flora
  Alpha / project id 65357 unless a different project is explicitly requested.

  Authentication uses a shared PostHog API key from Kubernetes Secret
  `obot-mcp-shared-secrets`. The server runs `mcp-remote` over stdio and passes
  the API key as an Authorization header to `https://mcp.posthog.com/mcp`.

metadata:
  categories: Analytics, Developer Tools
  trellis-id: posthog

icon: https://unpkg.com/simple-icons@16.21.0/icons/posthog.svg
repoURL: https://posthog.com/docs/model-context-protocol

env:
  - key: POSTHOG_AUTH_HEADER
    name: PostHog Authorization Header
    description: Full Authorization header value, e.g. `Bearer phx_...`.
    required: true
    sensitive: true
    secretBinding:
      name: obot-mcp-shared-secrets
      key: posthog-api-key

runtime: npx
npxConfig:
  package: mcp-remote@latest
  args:
    - https://mcp.posthog.com/mcp
    - --header
    - Authorization:${POSTHOG_AUTH_HEADER}
  startupTimeoutSeconds: 120
