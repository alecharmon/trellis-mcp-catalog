name: GitHub
shortDescription: Work with GitHub repositories, issues, pull requests, and code search
description: |
  Remote GitHub MCP server exposed through Trellis/Obot.

  Use this server for repository inspection, issue/PR workflows, code search,
  and GitHub automation. Authentication uses the shared Obot GitHub PAT from
  the Kubernetes `obot-secrets` secret.

metadata:
  categories: Developer Tools, Source Control
  trellis-id: github

icon: https://avatars.githubusercontent.com/u/9919?v=4
repoURL: https://github.com/github/github-mcp-server

runtime: remote
remoteConfig:
  fixedURL: https://api.githubcopilot.com/mcp
  headers:
    - name: GitHub Personal Access Token
      description: Shared GitHub PAT used as a bearer token for GitHub MCP.
      key: Authorization
      required: false
      sensitive: true
      prefix: "Bearer "
      secretBinding:
        name: obot-secrets
        key: GITHUB_AUTH_TOKEN
