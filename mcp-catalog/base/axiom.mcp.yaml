name: Axiom
shortDescription: Query Flora logs and telemetry in Axiom
description: |
  Axiom MCP server exposed through Trellis/Obot via a local stdio server.

  Use this server for production log and trace investigation, especially the
  `flora-core` dataset referenced by flora-frontend runbooks and skills.

  Authentication uses shared Axiom credentials from Kubernetes Secret
  `obot-mcp-shared-secrets`. The server runs `mcp-server-axiom` over stdio with
  `AXIOM_TOKEN` and `AXIOM_ORG_ID` injected from Secret Manager.

metadata:
  categories: Observability, Developer Tools
  trellis-id: axiom

icon: https://axiom.co/favicon.ico
repoURL: https://axiom.co/docs/reference/mcp

env:
  - key: AXIOM_TOKEN
    name: Axiom API Token
    description: Shared Axiom API token for querying Flora telemetry.
    required: true
    sensitive: true
    secretBinding:
      name: obot-mcp-shared-secrets
      key: axiom-token
  - key: AXIOM_ORG_ID
    name: Axiom Organization ID
    description: Axiom organization ID for Flora.
    required: true
    sensitive: true
    secretBinding:
      name: obot-mcp-shared-secrets
      key: axiom-org-id
  - key: AXIOM_URL
    name: Axiom API URL
    description: Axiom API URL.
    required: false
    sensitive: false
    value: https://api.axiom.co

runtime: npx
npxConfig:
  package: mcp-server-axiom@latest
  startupTimeoutSeconds: 120
